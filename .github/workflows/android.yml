name: android-ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Lint + unit tests + debug build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (dependency caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Lint + unit tests + assemble (logged)
        run: |
          set -o pipefail
          ./gradlew lintDebug testDebugUnitTest assembleDebug --stacktrace 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Push build log to ci-logs branch (readable via API)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          tail -c 240000 build.log > build-tail.log
          SHA=$(git rev-parse HEAD)
          gh api -X POST "repos/${{ github.repository }}/git/refs" \
            -f ref=refs/heads/ci-logs -f sha="$SHA" >/dev/null 2>&1 || true
          sleep 2
          B64=$(base64 -w0 build-tail.log)
          gh api -X PUT "repos/${{ github.repository }}/contents/logs/run-${{ github.run_number }}.log" \
            -f message="ci log run ${{ github.run_number }}" \
            -f content="$B64" -f branch=ci-logs >/dev/null 2>&1 \
            && echo "log pushed to ci-logs branch" || echo "log push failed"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ara-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

  instrumented:
    name: Instrumented tests (Room + SQLCipher on emulator)
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Gradle caching
        uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          channel: stable
          boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          # Single-line form (proven to execute); the gradle verdict is written to
          # a file so emulator-console shutdown flakiness cannot mask it.
          script: cd android && ./gradlew :core-database:connectedDebugAndroidTest --stacktrace 2>&1 | tee instrumented.log; echo ${PIPESTATUS[0]} > "$GITHUB_WORKSPACE/instrumented_exit_code"; exit 0

      - name: Report instrumented test result
        if: always()
        run: |
          CODE=$(cat "$GITHUB_WORKSPACE/instrumented_exit_code" 2>/dev/null || echo 1)
          echo "gradle exit code: $CODE"
          exit "$CODE"

      - name: Push instrumented log to ci-logs branch
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          if [ -f ../android/instrumented.log ]; then tail -c 240000 ../android/instrumented.log > instrumented-tail.log;
          elif [ -f android/instrumented.log ]; then tail -c 240000 android/instrumented.log > instrumented-tail.log;
          elif [ -f instrumented.log ]; then tail -c 240000 instrumented.log > instrumented-tail.log;
          else echo "no log captured" > instrumented-tail.log; fi
          SHA=$(git rev-parse HEAD)
          gh api -X POST "repos/${{ github.repository }}/git/refs" \
            -f ref=refs/heads/ci-logs -f sha="$SHA" >/dev/null 2>&1 || true
          sleep 2
          B64=$(base64 -w0 instrumented-tail.log)
          gh api -X PUT "repos/${{ github.repository }}/contents/logs/run-${{ github.run_number }}-instrumented.log" \
            -f message="ci instrumented log run ${{ github.run_number }}" \
            -f content="$B64" -f branch=ci-logs >/dev/null 2>&1 \
            && echo "instrumented log pushed to ci-logs branch" || echo "log push failed"

  release:
    name: Signed release build (Phase 11)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: release
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode release keystore from secrets
        run: |
          if [ -z "${{ secrets.ARA_KEYSTORE_B64 }}" ]; then
            echo "::warning::ARA_KEYSTORE_B64 not set — skipping release build"
            exit 0
          fi
          echo "${{ secrets.ARA_KEYSTORE_B64 }}" | base64 -d > /tmp/ara-release.keystore
      - name: Assemble signed release
        env:
          ARA_KEYSTORE_PATH: /tmp/ara-release.keystore
          ARA_KEYSTORE_PASSWORD: ${{ secrets.ARA_KEYSTORE_PASSWORD }}
          ARA_KEY_ALIAS: ${{ secrets.ARA_KEY_ALIAS }}
          ARA_KEY_PASSWORD: ${{ secrets.ARA_KEY_PASSWORD }}
        run: |
          if [ ! -s /tmp/ara-release.keystore ]; then echo "no keystore — skip"; exit 0; fi
          ./gradlew assembleRelease bundleRelease
          # Archive the R8 mapping for crash de-obfuscation (§9 checklist).
          cp app/build/outputs/mapping/release/mapping.txt mapping-$GITHUB_SHA.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ara-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/mapping-*.txt
          if-no-files-found: ignore
