# coturn config for Ara calls (spec §3). Long-term credentials are issued by
# the signaling tier via the REST API (TURN REST auth) in production; the
# static credentials below are for local development only.
listening-port=3478
tls-listening-port=5349
fingerprint
lt-cred-mech
realm=ara.example
user=ara:ara-dev-turn-secret
# Restrict relaying to prevent abuse as an open proxy:
no-multicast-peers
no-cli
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
